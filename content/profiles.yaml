# Author profiles elsewhere on the web.
#
# Each entry becomes a sameAs on the Person in the site's structured data, a
# link in the "Find me elsewhere" list on /about/, and a line in llms.txt.
# sameAs is how a search engine works out that these profiles and this site are
# the same person, which is the main reason to bother with them: most of these
# links are nofollow and pass no ranking signal on their own.
#
# To add one: uncomment the line, paste the real URL, run `python3 build.py`.
# Leave anything you have not actually created commented out. An empty or wrong
# profile is worse than none, and the build will refuse a URL that is not https.

