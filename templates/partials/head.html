<!-- Visitor log for the site owner: one beacon on arrival, one on leaving.
     No cookies; read it in Netlify's function logs (netlify/functions/visit.mjs). -->
<script>
  (function () {
    var start = Date.now(), maxScroll = 0;
    var base = function () {
      var c = navigator.connection || {};
      return {
        page: location.pathname + location.search, ref: document.referrer,
        screen: screen.width + 'x' + screen.height + '@' + devicePixelRatio,
        viewport: innerWidth + 'x' + innerHeight,
        tz: (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone,
        langs: (navigator.languages || []).join(','), net: c.effectiveType || '',
        touch: navigator.maxTouchPoints || 0, webdriver: !!navigator.webdriver
      };
    };
    var send = function (data) {
      try { navigator.sendBeacon('/api/visit', JSON.stringify(data)); } catch (e) {}
    };
    addEventListener('scroll', function () {
      var h = document.documentElement.scrollHeight - innerHeight;
      if (h > 0) maxScroll = Math.max(maxScroll, Math.round(scrollY / h * 100));
    }, { passive: true });
    addEventListener('load', function () { send(base()); });
    addEventListener('pagehide', function () {
      var d = base(); d.kind = 'leave'; d.seconds = (Date.now() - start) / 1000; d.scroll = maxScroll;
      send(d);
    });
  })();
</script>
<!-- Google tag (gtag.js). The config queues straight away; the 178 KB library

    var go = function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ME9LJ3ENQH';
      document.head.appendChild(s);
    };
    'requestIdleCallback' in window ? requestIdleCallback(go, { timeout: 3000 }) : setTimeout(go, 1);
  });
</script>
