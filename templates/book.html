<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{seo}
{head}
<script type="application/ld+json">
{schema}
</script>
</head>
<body>
{header}
<main id="main" class="full">

  <article class="book-page" style="{style}">

    <header class="book-hero">
      <div class="container">
        <div class="book-hero-inner">
          <div class="book-hero-cover">{cover}</div>
          <div class="book-hero-info">
            <nav class="crumbs" aria-label="Breadcrumb">
              <a href="/">Home</a> <span aria-hidden="true">/</span> <a href="/books/">Books</a> <span aria-hidden="true">/</span> <a href="/books/#{group}">{group_title}</a>
            </nav>
            <span class="eyebrow">{series_label}</span>
            <h1>{title}</h1>
            {subtitle}
            <p class="book-pitch">{pitch}</p>
            <div class="btn-row">
              <a class="btn btn-light" href="#get-the-book">Get the book</a>
              <a class="btn btn-outline" href="#inside">What is inside</a>
            </div>
            <div class="book-facts">{facts}</div>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="book-layout">
        <div class="book-main">
          <div class="post-body book-body" id="inside">
{body}
          </div>
          {related}
          {articles}
          {author_box}
          <p class="disclaimer">{disclaimer}</p>
        </div>
        <aside class="book-aside" aria-label="Formats and series">
          {get_book}
          {series_box}
        </aside>
      </div>
    </div>

  </article>

</main>

{footer}
</body>
</html>
