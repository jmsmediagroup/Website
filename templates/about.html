<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{seo}
{head}
<script type="application/ld+json">
{schema}
</script>
</head>
<body>
{header}
<main id="main">

  <article class="about-page">

    <header class="page-header">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="/">Home</a> <span>/</span> <span>About</span>
      </nav>
      <span class="section-tag">About the author</span>
      <h1>J.M. <em>Struijk.</em></h1>
      <p class="page-lede">{description}</p>
    </header>

    <div class="about-layout">
      <aside class="about-portrait">
        <img src="/assets/images/author.jpg" alt="J.M. Struijk" width="562" height="900" fetchpriority="high" decoding="async">
        <p class="about-portrait-caption"><strong>J.M. Struijk</strong><br>ADHD &amp; autistic · Wyoming, USA</p>
        <dl class="about-facts">
          <div><dt>Books in print</dt><dd>{book_count}</dd></div>
          <div><dt>Articles</dt><dd>{post_count}</dd></div>
          <div><dt>Publisher</dt><dd>JMS Media Group LLC</dd></div>
        </dl>
      </aside>

      <div class="post-body about-body">
{body}
      </div>
    </div>

    {shelf}

    <p class="disclaimer">{disclaimer}</p>

  </article>

</main>

{footer}
</body>
</html>
