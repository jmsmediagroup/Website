<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{seo}
{head}
<script type="application/ld+json">
{schema}
</script>
</head>
<body>
{header}

  <article class="post">

    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="/">Home</a> <span>/</span> <a href="/blog/">Blog</a>
    </nav>

    <header class="post-header">
      <h1>{title}</h1>
      <p class="post-standfirst">{description}</p>
      <div class="post-meta">
        <span>By <a href="/#about">J.M. Struijk</a></span>
        <span class="post-dot">·</span>
        <time datetime="{date_iso}">{date_human}</time>
        <span class="post-dot">·</span>
        <span>{reading_time} min read</span>
      </div>
      {topics}
    </header>

    {toc}

    <div class="post-body">
{body}
    </div>

    {book_cta}

    {author_box}

    <p class="disclaimer">{disclaimer}</p>

    {related}

    {signup}

  </article>

{footer}
</body>
</html>
